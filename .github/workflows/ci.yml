name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API (lint, testes, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aprovame
          POSTGRES_PASSWORD: aprovame
          POSTGRES_DB: aprovame
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aprovame" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://aprovame:aprovame@localhost:5432/aprovame?schema=public
      REDIS_HOST: localhost
      JWT_SECRET: segredo-de-ci-com-tamanho-suficiente
      BATCH_BACKOFF_MS: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: |
          ../.github/scripts/run.sh "API: npm install" sh -c 'if [ -f package-lock.json ]; then npm ci; else npm install; fi'
      - name: Gerar client do Prisma
        run: |
          ../.github/scripts/run.sh "API: prisma generate" npx prisma generate
      - name: Lint
        run: |
          ../.github/scripts/run.sh "API: lint" npm run lint
      - name: Checagem de tipos
        run: |
          ../.github/scripts/run.sh "API: typecheck" npm run typecheck
      - name: Testes unitários
        run: |
          ../.github/scripts/run.sh "API: testes unitários" npm run test:cov
      - name: Build
        run: |
          ../.github/scripts/run.sh "API: build" npm run build
      - name: Migrações
        run: |
          ../.github/scripts/run.sh "API: migrações" npx prisma migrate deploy
      - name: Testes e2e
        run: |
          ../.github/scripts/run.sh "API: testes e2e" npm run test:e2e

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build da API
        run: |
          .github/scripts/run.sh "Docker: API" docker build -t aprova-me-api ./backend
      - name: Build do front
        if: ${{ hashFiles('frontend/Dockerfile') != '' }}
        run: |
          .github/scripts/run.sh "Docker: front" docker build -t aprova-me-web ./frontend
